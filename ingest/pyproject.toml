[project]
name = "pathways-ingest"
version = "0.1.0"
description = "Pathways data ingestion: CSC checklist XLSX parser + participating-communities portal scraper"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]